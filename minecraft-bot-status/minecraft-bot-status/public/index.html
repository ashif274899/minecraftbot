<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minecraft Bot Status</title>
  <style>
    :root { color-scheme: dark; --bg:#080b12; --card:#111827; --muted:#94a3b8; --text:#f8fafc; --border:#263244; --green:#22c55e; --red:#ef4444; --yellow:#f59e0b; --blue:#60a5fa; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(circle at top,#162033 0,#080b12 45%); color:var(--text); min-height:100vh; }
    .wrap { max-width:1000px; margin:auto; padding:40px 18px; }
    .header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:24px; }
    h1 { margin:0 0 6px; font-size:clamp(28px,5vw,44px); }
    .sub { color:var(--muted); margin:0; }
    .pill { border:1px solid var(--border); background:#0d1420; padding:9px 13px; border-radius:999px; color:var(--muted); font-size:13px; }
    .grid { display:grid; grid-template-columns:1.2fr .8fr; gap:16px; }
    .card { background:rgba(17,24,39,.86); border:1px solid var(--border); border-radius:18px; padding:22px; box-shadow:0 18px 60px rgba(0,0,0,.25); }
    .status-card { min-height:230px; display:flex; flex-direction:column; justify-content:center; }
    .status { display:flex; align-items:center; gap:14px; font-size:30px; font-weight:800; }
    .dot { width:18px; height:18px; border-radius:50%; background:var(--yellow); box-shadow:0 0 20px currentColor; }
    .online .dot { background:var(--green); color:var(--green); }
    .offline .dot, .error .dot { background:var(--red); color:var(--red); }
    .connecting .dot, .starting .dot { background:var(--yellow); color:var(--yellow); }
    .message { color:var(--muted); margin:12px 0 22px; }
    .details { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .item { background:#0b111c; border:1px solid #1e293b; border-radius:12px; padding:13px; }
    .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
    .value { margin-top:5px; font-weight:650; word-break:break-word; }
    .log-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .log-head h2 { margin:0; font-size:18px; }
    .logs { max-height:470px; overflow:auto; display:flex; flex-direction:column; gap:8px; }
    .log { padding:11px 12px; border-radius:10px; background:#0b111c; border:1px solid #1e293b; font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .log .time { color:#64748b; margin-right:8px; }
    .log.success { border-left:3px solid var(--green); }
    .log.error { border-left:3px solid var(--red); }
    .log.warn { border-left:3px solid var(--yellow); }
    .log.info { border-left:3px solid var(--blue); }
    .empty { color:var(--muted); text-align:center; padding:30px 10px; }
    footer { color:#64748b; font-size:12px; margin-top:18px; text-align:center; }
    @media(max-width:760px){ .grid{grid-template-columns:1fr;} .header{align-items:flex-start; flex-direction:column;} }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div><h1>⛏️ Minecraft Bot Status</h1><p class="sub">Live status, connection details and recent errors.</p></div>
      <div class="pill" id="updated">Connecting…</div>
    </header>

    <section class="grid">
      <div class="card status-card" id="statusCard">
        <div class="status"><span class="dot"></span><span id="statusText">Starting…</span></div>
        <p class="message" id="message">Loading bot status…</p>
        <div class="details">
          <div class="item"><div class="label">Bot</div><div class="value" id="username">—</div></div>
          <div class="item"><div class="label">Minecraft Server</div><div class="value" id="server">—</div></div>
          <div class="item"><div class="label">Version</div><div class="value" id="version">—</div></div>
          <div class="item"><div class="label">Last Error</div><div class="value" id="error">None</div></div>
        </div>
      </div>

      <div class="card">
        <div class="log-head"><h2>📋 Error / Event Log</h2><span class="pill" id="logCount">0</span></div>
        <div class="logs" id="logs"><div class="empty">No logs yet.</div></div>
      </div>
    </section>

    <footer>Live updates are delivered automatically. This page does not expose bot credentials.</footer>
  </main>

<script>
  const $ = id => document.getElementById(id)
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))
  const niceStatus = s => ({online:'Online — Inside Minecraft', connecting:'Connecting…', starting:'Starting…', offline:'Offline', error:'Error'})[s] || s
  const time = iso => iso ? new Date(iso).toLocaleString() : '—'

  function render(data) {
    document.body.className = data.status || ''
    $('statusCard').className = `card status-card ${data.status || ''}`
    $('statusText').textContent = niceStatus(data.status)
    $('message').textContent = data.message || '—'
    $('username').textContent = data.username || '—'
    $('server').textContent = data.server || '—'
    $('version').textContent = data.version || '—'
    $('error').textContent = data.lastError || 'None'
    $('updated').textContent = `Updated ${new Date().toLocaleTimeString()}`
    $('logCount').textContent = data.logs?.length || 0

    const entries = [...(data.logs || [])].reverse()
    $('logs').innerHTML = entries.length ? entries.map(log => `
      <div class="log ${esc(log.level)}">
        <span class="time">${esc(time(log.time))}</span>
        <strong>${esc(log.level.toUpperCase())}</strong> ${esc(log.message)}
        ${log.details ? `<div style="margin-top:4px;color:#94a3b8">${esc(log.details)}</div>` : ''}
      </div>`).join('') : '<div class="empty">No logs yet.</div>'
  }

  async function load() {
    try {
      const r = await fetch('/api/status', {cache:'no-store'})
      render(await r.json())
    } catch (e) { $('updated').textContent = 'Connection lost' }
  }

  if ('EventSource' in window) {
    const source = new EventSource('/api/events')
    source.onmessage = event => render(JSON.parse(event.data))
    source.onerror = () => load()
  } else {
    load(); setInterval(load, 3000)
  }
  load()
</script>
</body>
</html>
